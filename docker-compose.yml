services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-giveaway_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
      POSTGRES_DB: ${POSTGRES_DB:-giveaway}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giveaway_bot} -d ${POSTGRES_DB:-giveaway}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # Do not expose port publicly in production

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-giveaway_bot}:${POSTGRES_PASSWORD:-change-me-strong-password}@db:5432/${POSTGRES_DB:-giveaway}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${HEALTH_PORT:-8080}:8080"
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-giveaway_bot}:${POSTGRES_PASSWORD:-change-me-strong-password}@db:5432/${POSTGRES_DB:-giveaway}
    networks:
      - internal
    profiles:
      - migrate

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    driver: bridge
